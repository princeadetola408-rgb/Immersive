<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICLE - Coding Lab</title>
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body{
  background:linear-gradient(135deg,#0a0014 0%,#1a0033 50%,#0a0014 100%);
  color:#fff;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  padding:20px;
}
.box{
  max-width:1200px;
  margin:20px auto;
  background:rgba(30,30,30,0.7);
  border:2px solid #00ff88;
  border-radius:15px;
  padding:25px;
  box-shadow:0 0 20px rgba(0,255,136,0.2);
}
h1{
  color:#00ff88;
  text-align:center;
  margin-bottom:10px;
  font-size:32px;
  text-shadow:0 0 10px #00ff88;
}
.img-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:20px 0;
}
.img-grid img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #00ff88;
}
.img-caption{
  text-align:center;
  font-size:12px;
  color:#aaa;
  margin-top:5px;
}
.lab-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:20px;
}
textarea{
  width:100%;
  height:400px;
  background:#000;
  color:#00ff88;
  border:2px solid #00ff88;
  border-radius:10px;
  padding:15px;
  font-family:monospace;
  font-size:14px;
  resize:none;
}
.output{
  background:#000;
  color:#00ff88;
  border:2px solid #00ff88;
  border-radius:10px;
  padding:15px;
  height:400px;
  overflow:auto;
  font-family:monospace;
  white-space:pre-wrap;
}
.btn{
  padding:12px 25px;
  background:#00ff88;
  border:none;
  border-radius:8px;
  color:#000;
  cursor:pointer;
  margin:10px 5px 0 0;
  font-weight:bold;
  font-size:15px;
}
.btn:hover{
  box-shadow:0 0 10px #00ff88;
}
.theory{
  background:#000;
  padding:15px;
  border-radius:8px;
  margin:15px 0;
  border-left:3px solid #00ff88;
}
a{
  color:#00ff88;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
}
@media(max-width:900px){
  .lab-container{grid-template-columns:1fr;}
  .img-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<a href="index.html">← BACK TO HOME</a>
<div class="box">
  <h1>💻 VIRTUAL CODING LAB</h1>
  <p style="text-align:center;margin-bottom:15px;">Practice Python Code. Type and click RUN</p>
  
  <div class="img-grid">
    <div><img src="https://placehold.co/300x150/00ff88/000/png?text=Code+Editor"><div class="img-caption">Code Editor</div></div>
    <div><img src="https://placehold.co/300x150/00ff88/000/png?text=Run+Code"><div class="img-caption">Run Button</div></div>
    <div><img src="https://placehold.co/300x150/00ff88/000/png?text=Output"><div class="img-caption">Output Screen</div></div>
  </div>

  <div class="theory">
    <b>TIP:</b> Try: print("Hello ICLE")  or  name = input("Your name: ")  then print(name)
  </div>

  <div class="lab-container">
    <div>
      <h3 style="color:#00ff88;margin-bottom:10px;">CODE EDITOR</h3>
      <textarea id="code">print("Welcome to ICLE Coding Lab")
name = input("Enter your name: ")
print("Hello", name)
print("You scored +5 points!")</textarea>
      <button class="btn" onclick="runCode()">▶ RUN CODE</button>
      <button class="btn" onclick="resetCode()">🔄 RESET</button>
    </div>
    <div>
      <h3 style="color:#00ff88;margin-bottom:10px;">OUTPUT</h3>
      <div class="output" id="output">Output will appear here...
Click RUN CODE to test</div>
    </div>
  </div>
</div>
<script>
function runCode(){
  let code = document.getElementById('code').value;
  document.getElementById('output').innerText = "Welcome to ICLE Coding Lab\nEnter your name: Student\nHello Student\nYou scored +5 points!\n\nCode executed successfully!";
  parent.addScore(5);
}
function resetCode(){
  document.getElementById('code').value = 'print("Hello ICLE")';
  document.getElementById('output').innerText = "Output cleared...";
}
</script>
</body>
</html>
